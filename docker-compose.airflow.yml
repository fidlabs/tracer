services:
  airflow-webserver:
    image: apache/airflow:2.9.2-python3.11
    build: null
    command: bash -lc "airflow webserver"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Install extras at container start (official way)
      PIP_ADDITIONAL_REQUIREMENTS: >-
        clickhouse-connect==0.7.18
        apache-airflow-providers-amazon==9.1.0
        boto3==1.34.162
        opensearch-py==2.6.0
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./logs:/opt/airflow/logs

  airflow-scheduler:
    image: apache/airflow:2.9.2-python3.11
    build: null
    command: bash -lc "airflow scheduler"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PIP_ADDITIONAL_REQUIREMENTS: >-
        clickhouse-connect==0.7.18
        apache-airflow-providers-amazon==9.1.0
        boto3==1.34.162
        opensearch-py==2.6.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./logs:/opt/airflow/logs

  airflow-init:
    image: apache/airflow:2.9.2-python3.11
    build: null
    command: >
      bash -lc "
      airflow db init &&
      airflow users create --role Admin --username $${_AIRFLOW_WWW_USER_USERNAME:-admin}
        --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname admin --lastname admin
        --email admin@example.com || true
      "
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
